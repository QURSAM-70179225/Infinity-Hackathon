<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Transcript flow: paste, AI draft, validate, workload check, transactional save" xmlns:c2pa="http://c2pa.org/manifest">
<title>Transcript flow: paste, AI draft, validate, workload check, transactional save</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="430" rx="18" fill="#f8fafc"/>
<rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="none" stroke="#e2e8f0"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="start">From transcript to saved work</text>
<text x="40" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Nothing is saved until the whole draft is valid and nobody is overloaded.</text>
<g filter="url(#sh)"><rect x="40" y="120" width="196" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="40" y="120" width="196" height="6" rx="3" fill="#4f46e5"/>
<circle cx="70" cy="164" r="16" fill="#4f46e5"/>
<text x="70" y="169" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="96" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Admin pastes</text>
<text x="60" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">the meeting transcript</text>
<line x1="240" y1="180" x2="272" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="276" y="120" width="196" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="276" y="120" width="196" height="6" rx="3" fill="#7c3aed"/>
<circle cx="306" cy="164" r="16" fill="#7c3aed"/>
<text x="306" y="169" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="332" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">AI drafts</text>
<text x="296" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">projects and tasks as JSON</text>
<line x1="476" y1="180" x2="508" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="512" y="120" width="196" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="512" y="120" width="196" height="6" rx="3" fill="#f59e0b"/>
<circle cx="542" cy="164" r="16" fill="#f59e0b"/>
<text x="542" y="169" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="568" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Validate</text>
<text x="532" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">people, dates, hours</text>
<line x1="712" y1="180" x2="744" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="748" y="120" width="196" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="748" y="120" width="196" height="6" rx="3" fill="#f59e0b"/>
<circle cx="778" cy="164" r="16" fill="#f59e0b"/>
<text x="778" y="169" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="804" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Workload</text>
<text x="768" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">40 hour capacity check</text>
<line x1="948" y1="180" x2="980" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect x="984" y="120" width="196" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g><rect x="984" y="120" width="196" height="6" rx="3" fill="#059669"/>
<circle cx="1014" cy="164" r="16" fill="#059669"/>
<text x="1014" y="169" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="1040" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Save</text>
<text x="1004" y="210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">one transaction</text>
<line x1="610.0" y1="244" x2="610.0" y2="286" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrR)"/>
<rect x="512" y="290" width="196" height="92" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-opacity="0.35"/>
<rect x="526" y="302" width="31" height="22" rx="11.0" fill="#dc2626"/><text x="541.3" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">422</text>
<text x="526" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Unresolved person or date</text>
<text x="526" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Admin corrects the draft</text>
<line x1="846.0" y1="244" x2="846.0" y2="286" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<rect x="748" y="290" width="196" height="92" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-opacity="0.35"/>
<rect x="762" y="302" width="31" height="22" rx="11.0" fill="#c2410c"/><text x="777.3" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">409</text>
<text x="762" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">A developer above 40h</text>
<text x="762" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Reassign or save anyway</text>
<line x1="1082.0" y1="244" x2="1082.0" y2="286" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
<rect x="984" y="290" width="196" height="92" rx="12" fill="#ecfdf5" stroke="#059669" stroke-opacity="0.35"/>
<rect x="998" y="302" width="31" height="22" rx="11.0" fill="#059669"/><text x="1013.3" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">201</text>
<text x="998" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Saved: 3 projects, 12 tasks</text>
<text x="998" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Visible by role at once</text>
<path d="M 512 336 C 452 336, 452 210, 508 210" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" opacity="0.6"/>
<text x="40" y="412" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Only the admin can run this. The AI never receives emails or passwords, only names, roles and skills from the team directory.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>